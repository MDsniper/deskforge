services:
  local-ai-gpu-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-ai-gpu-site
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
