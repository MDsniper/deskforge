services:
  deskforge:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AMAZON_ASSOCIATE_TAG: ${NEXT_PUBLIC_AMAZON_ASSOCIATE_TAG:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://deskforge.ai}
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
